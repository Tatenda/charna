<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Receipt - Charna</title>
    <style>
        body { font-family: 'Arial', sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 0; }
        .header { background: #B67E5A; color: white; padding: 30px; text-align: center; }
        .brand { font-size: 32px; font-weight: bold; margin: 0; }
        .brand-dot { color: #D4A574; font-size: 48px; }
        .content { padding: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="brand"><a href="https://www.charna.co.com" style="color: white; text-decoration: none;">Charna<span class="brand-dot">.</span></a></h1>
            <p style="margin: 10px 0 0; font-size: 16px;">Premium Handcrafted Leather Goods</p>
        </div>
        
        <div class="content">
            <h2 style="color: #B67E5A; margin-bottom: 10px;">This is a test receipt</h2>
            <p>The Charna logo above should be displayed as "Charna." with a golden dot.</p>
            <p>It should be clickable and link to www.charna.co.com</p>
        </div>
    </div>
</body>
</html>
